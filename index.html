<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alfred">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Alfred</title>
<style>html,body{background:#000}</style>
</head>
<body>
<meta name="description" content="Apple Notes, rebuilt 1:1 for trading — one note per day, browsed through an Apple Calendar month view.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* San Francisco is used wherever it is installed (all Apple devices). It cannot be embedded, so Inter stands in elsewhere. */
@font-face{font-family:"SF Pro";font-weight:400;src:local("SF Pro Text"),local("SF Pro Display"),local("SFProText-Regular"),local(".SFNSText-Regular"),local(".SF NS Text"),local(".SF NS")}
@font-face{font-family:"SF Pro";font-weight:500;src:local("SF Pro Text Medium"),local("SFProText-Medium"),local(".SFNSText-Medium")}
@font-face{font-family:"SF Pro";font-weight:600;src:local("SF Pro Text Semibold"),local("SFProText-Semibold"),local("SF Pro Display Semibold"),local(".SFNSText-Semibold")}
@font-face{font-family:"SF Pro";font-weight:700;src:local("SF Pro Display Bold"),local("SFProDisplay-Bold"),local("SF Pro Text Bold"),local(".SFNSText-Bold")}

/* ===== iOS system palette ===== */
:root{
  --bg:#F2F2F7; --plain:#FFFFFF; --cell:#FFFFFF; --cell2:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.60); --label3:rgba(60,60,67,.30); --label4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16); --fill3:rgba(120,120,128,.20);
  --yellow:#FFCC00; --red:#FF3B30; --blue:#007AFF; --gray:#8E8E93; --green:#34C759;
  --gain:#34C759; --loss:#FF3B30; --upbg:rgba(52,199,89,.16); --downbg:rgba(255,59,48,.14); --incard:#F2F2F7; --onacc:#fff; --ck:#fff; --segon:#fff;
  --nav:rgba(249,249,249,.94); --sheet:rgba(255,255,255,.92);
  --glass:rgba(255,255,255,.58); --glass-press:rgba(255,255,255,.78); --glass-rim:rgba(255,255,255,.85); --glass-rim2:rgba(0,0,0,.06);
  --glass-shadow:0 8px 24px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --sans:"SF Pro",-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue","Segoe UI",system-ui,Roboto,Arial,var(--emoji);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --plain:#000; --cell:#1C1C1E; --cell2:#2C2C2E;
  --label:#FFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30); --label4:rgba(235,235,245,.18);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill3:rgba(120,120,128,.36);
  --yellow:#FFD60A; --red:#FF453A; --blue:#0A84FF; --green:#30D158;
  --gain:#30D158; --loss:#FF453A; --upbg:rgba(48,209,88,.18); --downbg:rgba(255,69,58,.2); --incard:#1C1C1E; --segon:#636366;
  --nav:rgba(29,29,31,.94); --sheet:rgba(44,44,46,.92);
  --glass:rgba(58,58,62,.52); --glass-press:rgba(90,90,96,.66); --glass-rim:rgba(255,255,255,.22); --glass-rim2:rgba(255,255,255,.05);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000; --plain:#000; --cell:#1C1C1E; --cell2:#2C2C2E;
  --label:#FFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30); --label4:rgba(235,235,245,.18);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill3:rgba(120,120,128,.36);
  --yellow:#FFD60A; --red:#FF453A; --blue:#0A84FF; --green:#30D158;
  --gain:#30D158; --loss:#FF453A; --upbg:rgba(48,209,88,.18); --downbg:rgba(255,69,58,.2); --incard:#1C1C1E; --segon:#636366;
  --nav:rgba(29,29,31,.94); --sheet:rgba(44,44,46,.92);
  --glass:rgba(58,58,62,.52); --glass-press:rgba(90,90,96,.66); --glass-rim:rgba(255,255,255,.22); --glass-rim2:rgba(255,255,255,.05);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* Batman mode: Gotham steel — one cold hue on black. Ice-blue accents, slate losses, blue searchlight glow. */
:root[data-mode="batman"]{
  --bg:#000; --plain:#000; --cell:#0F1318; --cell2:#171C23;
  --label:#EEF2F8; --label2:rgba(196,208,224,.62); --label3:rgba(196,208,224,.32); --label4:rgba(196,208,224,.18);
  --sep:rgba(120,140,170,.28); --fill:rgba(120,140,170,.16); --fill2:rgba(120,140,170,.22); --fill3:rgba(120,140,170,.28);
  --glass:rgba(22,28,38,.6); --glass-press:rgba(40,50,66,.7); --glass-rim:rgba(190,210,240,.28); --glass-rim2:rgba(190,210,240,.06);
  --nav:rgba(12,15,20,.94); --sheet:rgba(22,27,36,.94);
  --yellow:#CFDDF0; --red:#CFDDF0; --blue:#CFDDF0; --green:#8FB4E3;
  --gain:#8FB4E3; --loss:#6B7684; --upbg:rgba(143,180,227,.14); --downbg:rgba(107,118,132,.12);
  --incard:#0F1318; --onacc:#000; --ck:#000; --segon:#3A4656;
}
:root[data-mode="batman"] .month .glow{opacity:.34}
:root[data-mode="batman"] .dcell .p{background:transparent;padding:0;font-size:11px;font-weight:600}
:root[data-mode="batman"] .dcell.off.today .n{color:var(--onacc)}
:root[data-mode="batman"] .startbtn:not(.sec){color:#000}
:root[data-mode="batman"] .startbtn.sec{color:var(--label)}
:root[data-mode="batman"] .frow .ico.red,:root[data-mode="batman"] .month.cur .mhead h3 span{color:var(--label)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* iPhone safe areas (notch, home indicator) when run as a standalone web app; env() is 0 elsewhere */
.nav{top:env(safe-area-inset-top,0px)}
.content{padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.asheet{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.psheet .pfoot{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.fmt{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.3 var(--sans);letter-spacing:-.4px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;letter-spacing:inherit}
input{font:inherit;color:inherit;background:transparent;border:0;padding:0;letter-spacing:inherit}
input:focus,[contenteditable]:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== phone frame & navigation stack ===== */
.phone{position:relative;height:100dvh;max-width:600px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transform:translateX(100%);transition:transform .4s var(--ease);will-change:transform}
.screen.plain{background:var(--plain)}
.screen.on{transform:none;z-index:2}
.screen.under{transform:translateX(-30%);z-index:1}
.screen.under::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}

/* ===== Liquid Glass (controls layer only — content stays solid) ===== */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-rim2);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,var(--glass-rim),transparent 42%,transparent 60%,var(--glass-rim));
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude;opacity:.9}
.gbtn{transition:transform .22s cubic-bezier(.2,1.6,.4,1),background .15s}
.gbtn:active{transform:scale(1.07);background:var(--glass-press)}
.circ{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.circ svg{width:21px;height:21px;stroke-width:1.9}
.pill{border-radius:999px}

/* ===== navigation bar (content scrolls underneath; soft scroll-edge blur) ===== */
.nav{position:absolute;top:0;left:0;right:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;pointer-events:none;z-index:-1;
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent);opacity:0;transition:opacity .2s}
.scrolled .nav::before{opacity:1}
.back{display:inline-flex;align-items:center;gap:2px;height:42px;padding:0 14px 0 9px;color:var(--accent);font-size:17px;white-space:nowrap}
.back svg{width:12px;height:20px;stroke-width:2.6;margin-right:2px}
.ctitle{position:absolute;left:96px;right:96px;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .18s;pointer-events:none;top:0;height:56px;display:flex;align-items:center;justify-content:center}
.scrolled .ctitle{opacity:1}
.acts{display:flex;align-items:center;height:42px;padding:0 2px}
.acts button{width:42px;height:42px;display:grid;place-items:center;color:var(--accent);border-radius:50%;position:relative;z-index:2}
.acts button svg{width:21px;height:21px;stroke-width:1.9}
.acts .txt{width:auto;font-size:17px;font-weight:600;padding:0 14px}
.acts button:active{transform:scale(1.08)}
.large{padding:6px 20px 10px;font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.2}
.large.greet{padding-bottom:2px;text-wrap:balance}
.subdate{padding:0 20px 16px;font-size:17px;color:var(--label2)}
/* Start / End session */
.startbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px 14px;height:54px;border-radius:999px;background:var(--yellow);color:#000;font-size:17px;font-weight:600;width:calc(100% - 32px);transition:transform .15s var(--ease),filter .15s}
.startbtn:active{transform:scale(.98);filter:brightness(.95)}
.startbtn.sec{background:var(--cell);color:var(--yellow)}
.startbtn svg{width:20px;height:20px;stroke-width:2.2}
.sstat{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 16px 14px;padding:14px 20px;border-radius:26px;background:var(--cell);font-size:15px;color:var(--label2)}
.sstat b{color:var(--label);font-weight:600} .sstat .pl{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
/* Alfred */
.alf{margin:0 16px 14px;padding:16px 20px;border-radius:26px;background:var(--cell)}
.alf .k{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
.alf p{margin:0;font-size:17px;line-height:1.4;letter-spacing:-.4px}
/* Stats (Screen Time / Health style) */
.seg2{display:flex;margin:0 16px 18px;background:var(--fill);border-radius:999px;padding:3px}
.seg2 button{flex:1;height:34px;border-radius:999px;font-size:14px;font-weight:500;text-align:center;color:var(--label);transition:background .15s}
.seg2 button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.shead{display:flex;align-items:center;gap:6px;padding:0 16px 8px;margin-top:8px;font-size:20px;font-weight:700;letter-spacing:.38px}
.scard{margin:0 16px 18px;background:var(--cell);border-radius:26px;padding:18px 20px 16px}
.scard .k{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.scard .big{font-size:36px;font-weight:700;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.scard .sub{font-size:13px;color:var(--label2);margin-top:4px}
.scard svg.eq{width:100%;height:120px;display:block;margin-top:14px;overflow:visible}
.srows{margin:0 16px 18px;background:var(--cell);border-radius:26px;overflow:hidden}
.row2{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 20px;position:relative}
.row2+.row2::before{content:"";position:absolute;left:20px;right:0;top:0;height:.5px;background:var(--sep)}
.row2 .n{font-size:17px} .row2 .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.row2 .v small{font-weight:400;color:var(--label2);font-size:13px;margin-left:6px;letter-spacing:0}
.bar2{display:grid;grid-template-columns:118px 1fr 78px;gap:10px;align-items:center;padding:10px 20px;font-size:15px;position:relative}
.bar2+.bar2::before{content:"";position:absolute;left:20px;right:0;top:0;height:.5px;background:var(--sep)}
.bar2 .l{color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bar2 .l small{display:block;font-size:12px;color:var(--label2)}
.bar2 .trk{height:8px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden}
.bar2 .trk i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--yellow)} .bar2 .trk i.up{background:var(--gain)} .bar2 .trk i.down{background:var(--loss)}
.bar2 .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
/* P&L card inside the Debrief sheet */
.pnlcard .pin{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:6px 0 18px}
.pnlcard .pin .c{font-size:34px;font-weight:600;color:var(--label2)}
.pnlcard .pin input{width:220px;font-size:60px;font-weight:700;letter-spacing:-2.5px;text-align:center;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--label)}
.pnlcard .pin input::placeholder{color:var(--label3)} .pnlcard .pin input.up{color:var(--gain)} .pnlcard .pin input.down{color:var(--loss)}
.pnlcard .two{display:flex;gap:8px}
.pnlcard .two label{flex:1;display:flex;align-items:center;justify-content:space-between;height:54px;border-radius:16px;background:var(--fill);padding:0 16px;font-size:17px;color:var(--label2)}
.pnlcard .two input{width:72px;text-align:right;font-size:17px;font-weight:600;color:var(--label);border:0;background:transparent}
.up{color:var(--gain)} .down{color:var(--loss)}
.content{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:56px;padding-bottom:120px}
.content::-webkit-scrollbar{display:none}

/* ===== floating bottom controls ===== */
.bottom{position:absolute;left:14px;right:14px;bottom:16px;z-index:6;display:flex;align-items:center;gap:10px}
.bottom.center{justify-content:center}
.search{flex:1;height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--label2);min-width:0}
.search svg{width:18px;height:18px;flex:none;stroke-width:2.2;position:relative;z-index:2}
.search input{flex:1;height:48px;font-size:17px;color:var(--label);min-width:0;position:relative;z-index:2}
.search input::placeholder{color:var(--label2)}
.circ.big{width:48px;height:48px} .circ.big svg{width:23px;height:23px}
.tabs{height:50px;display:flex;align-items:center;padding:4px}
.tabs button{height:42px;padding:0 22px;border-radius:999px;color:var(--accent);font-size:16px;font-weight:500;position:relative;z-index:2;transition:background .15s,transform .2s}
.tabs button:active{transform:scale(1.05);background:var(--fill)}
.count{text-align:center;font-size:12px;color:var(--label2);letter-spacing:0;margin:-14px 0 10px}

/* ===== inset grouped lists ===== */
.sech{display:flex;align-items:center;gap:6px;padding:0 16px 8px;margin-top:8px;font-size:20px;font-weight:700;letter-spacing:.38px}
.sech svg{width:13px;height:13px;color:var(--label3);stroke-width:2.6}
.sech .pin{width:15px;height:15px;color:var(--label2)}
.group{margin:0 16px 28px;background:var(--cell);border-radius:26px;overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 20px;width:100%;position:relative}
.frow+.frow::before{content:"";position:absolute;left:56px;right:0;top:0;height:.5px;background:var(--sep)}
.frow .ico{width:24px;height:24px;color:var(--yellow);flex:none;stroke-width:1.9}
.frow .ico.red{color:var(--red)} .frow .ico.gray{color:var(--gray)}
.frow .t{flex:1;font-size:17px}
.frow .cnt{color:var(--label2);font-size:17px;font-variant-numeric:tabular-nums}
.frow .cnt.up,.frow .cnt.down{font-weight:600}
.frow .hash{width:24px;text-align:center;font-size:20px;font-weight:600;color:var(--yellow);flex:none}
.chev{width:8px;height:14px;color:var(--label3);stroke-width:2.6;flex:none}
.frow:active,.nrow:active{background:var(--cell2)}
.foot{margin:-18px 32px 28px;font-size:13px;color:var(--label2);line-height:1.35}

/* Notes list rows */
.nrow{display:flex;align-items:center;gap:12px;padding:12px 20px;width:100%;position:relative;min-height:68px}
.nrow+.nrow::before{content:"";position:absolute;left:20px;right:0;top:0;height:.5px;background:var(--sep)}
.nrow .txt{flex:1;min-width:0}
.nrow .ttl{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:600;line-height:1.3}
.nrow .ttl span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .ttl .pnl{flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.nrow .tg{display:inline-block;color:var(--yellow);margin-right:6px;font-weight:500}
.nrow .sub{display:block;margin-top:3px;font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.24px}
.nrow .sub b{font-weight:400;color:var(--label);margin-right:8px}
.nrow .thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none;background:var(--cell2)}
.nrow .pinico{width:14px;height:14px;color:var(--label3);flex:none;margin-left:2px}
.empty{padding:40px 16px;text-align:center;color:var(--label2);font-size:17px}

/* ===== calendar — one glass card per month ===== */
.calwrap{padding:6px 14px 0}
.month{margin:0 0 14px;border-radius:26px;position:relative;overflow:hidden;background:var(--cell)}
.month.glass{background:var(--glass)}
/* a soft light behind the header, tinted by the month's result — the one place the glass gets something to refract */
.month .glow{position:absolute;left:-10%;right:-10%;top:-60px;height:170px;pointer-events:none;filter:blur(38px);opacity:.28;
  background:radial-gradient(closest-side,var(--glowc,var(--label3)),transparent)}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 20px 6px;position:relative;z-index:2}
.mhead h3{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
.month.cur .mhead h3 span{color:var(--red)}
.mhead .mp{text-align:right} .mhead .mp b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.1}
.mhead .mp small{display:block;font-size:12px;color:var(--label2);margin-top:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px 2px;position:relative;z-index:2}
.wk span{text-align:center;font-size:11px;font-weight:600;color:var(--label2);letter-spacing:.4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 12px;position:relative;z-index:2}
.dcell{height:58px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;border-radius:14px;transition:background .15s,transform .15s var(--ease)}
.dcell:not(.blank):active{background:var(--fill);transform:scale(.92)}
.dcell .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;letter-spacing:-.4px}
.dcell.today .n{background:var(--red);color:var(--onacc);font-weight:600}

/* ================= STATE ================= */
const state={entries:{},prefs:{theme:"auto",address:"Your Grace"},demo:false,stack:["folders"],listMode:"all",listTag:null,query:"",openDate:null,dirty:false,chartCache:{},editing:false};

/* ================= STORE (same documents as before: entries/{date}, charts/{date}, settings/prefs) ================= */
const Store={db:null,mode:"local",local:{entries:{},charts:{},prefs:{}},
  async init(){try{if(window.claude&&claude.use)this.db=await claude.use("db");}catch(e){this.db=null;}
    if(this.db){this.mode="db";
      this.db.collection("entries").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=x;});applyEntries(m);},
        ()=>{this.mode="local";this._loadLocal();applyEntries(this.local.entries||{});});
      this.db.doc("settings/prefs").onSnapshot(s=>{if(s.exists){Object.assign(state.prefs,s.data());applyTheme();}},()=>{});
    }else{this.mode="local";this._loadLocal();applyEntries(this.local.entries||{});applyTheme();}},
  async save(date){const e=state.entries[date];if(!e||e._demo)return;
    if(isBlank(e)&&!e.deleted){delete state.entries[date];return this.remove(date);}
    e.updated=Date.now();const body=JSON.parse(JSON.stringify(e));Object.keys(body).forEach(k=>{if(k[0]==="_")delete body[k];});
    if(body.trades)body.trades=body.trades.filter(t=>t.sym||t.pnl!=null||t.r!=null);body.pnl=dayPnl(body);
    if(this.mode==="db"){try{await this.db.doc("entries/"+date).set(body);}catch(err){}}else{this.local.entries[date]=body;this._persist();}},
  async remove(date){delete state.chartCache[date];
    if(this.mode==="db"){try{await this.db.doc("entries/"+date).delete();this.db.doc("charts/"+date).delete().catch(()=>{});}catch(e){}}
    else{delete this.local.entries[date];delete this.local.charts[date];this._persist();}},
  async savePrefs(){if(this.mode==="db"){try{await this.db.doc("settings/prefs").set(JSON.parse(JSON.stringify(state.prefs)));}catch(e){}}else{this.local.prefs=state.prefs;this._persist();}},
  async getChart(date){if(state.chartCache[date]!==undefined)return state.chartCache[date];let img=null;
    if(this.mode==="db"){try{const s=await this.db.doc("charts/"+date).get();img=s.exists?(s.data().img||null):null;}catch(e){}}else img=this.local.charts[date]||null;
    state.chartCache[date]=img;return img;},
  async setChart(date,img){state.chartCache[date]=img;
    if(this.mode==="db"){try{if(img)await this.db.doc("charts/"+date).set({img});else await this.db.doc("charts/"+date).delete();}catch(e){}}
    else{if(img)this.local.charts[date]=img;else delete this.local.charts[date];this._persist();}},
  _loadLocal(){try{this.local=Object.assign({entries:{},charts:{},prefs:{}},JSON.parse(localStorage.getItem(LSKEY))||{});}catch(e){this.local={entries:{},charts:{},prefs:{}};}
    Object.assign(state.prefs,this.local.prefs||{});},
  _persist(){try{localStorage.setItem(LSKEY,JSON.stringify(this.local));}catch(e){}}};

function isBlank(e){return !(e.title||"").trim()&&!(e.notes||"").trim()&&!e.hasChart&&!(e.trades&&e.trades.some(t=>t.sym||t.pnl))&&e.pnl==null&&e.tradeCount==null&&e.r==null&&!(e.pre&&Object.keys(e.pre).length)&&!(e.post&&e.post.feeling);}
function blank(date){return{date,title:"",notes:"",notesHtml:"",fmt:2,tags:[],pnl:null,tradeCount:null,r:null,hasChart:false,pinned:false,deleted:false,updated:Date.now()};}
function applyEntries(map){const real={};Object.entries(map).forEach(([k,v])=>real[k]=v);
  const od=state.openDate;if(od&&state.entries[od]&&!state.entries[od]._demo&&(state.dirty||!real[od]))real[od]=state.entries[od];
  /* purge Recently Deleted after 30 days, as Notes does */
  const cutoff=Date.now()-30*864e5;Object.values(real).forEach(e=>{if(e.deleted&&e.deletedAt&&e.deletedAt<cutoff){delete real[e.date];Store.remove(e.date);}});
  const hasReal=Object.values(real).some(e=>!isBlank(e));
  if(hasReal){state.demo=false;state.entries=real;}else{state.demo=true;state.entries=Object.assign(demoData(),real);}
  renderAll();}
function demoData(){const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d);};
  const mk=(n,title,html,x)=>{const e=Object.assign(blank(ago(n)),x);e.title=title;e.notesHtml=`<div>${esc(title)}</div>${html}`;e.notes=title+"\n"+html.replace(/<[^>]+>/g,"\n").replace(/\n+/g,"\n").trim();e.tags=tagsOf(e.notes);e._demo=true;e.updated=parseDate(ago(n)).getTime()+9*36e5;return e;};
  const a=mk(1,"Clean 10 AM long",`<div>Marked the 10:00 open at 19,482. Price swept the lows below it at 10:04, trapped the early shorts, then broke back up. #10am</div><div>Entered on the retest of the open · stop under the sweep · target PDH.</div><ul class="ckl"><li data-done="1">Wait for the sweep before the break</li><li data-done="1">Enter only on the retest</li><li data-done="1">Stop after two losses</li></ul>`,
    {pnl:640,tradeCount:1,r:2.4,pre:{sleep:4,calm:4,focus:5,control:4,confidence:4,energy:4},post:{feeling:4,plan:5,discipline:4,impulse:1,satisfaction:5,reflection:"Let the trap happen first. Same tomorrow."}});
  const b=mk(3,"Chased the 10 AM break",`<div>No sweep, no trap — price just broke the open and I chased it. Stopped out, then re-entered twice. #10am #revenge</div><h2>Lesson</h2><div>If price hasn't run the other way first, it isn't the setup.</div>`,
    {pnl:-310,tradeCount:5,r:-2.5,pre:{sleep:2,calm:2,focus:3,control:2,confidence:3,energy:2},post:{feeling:2,plan:2,discipline:2,impulse:4,satisfaction:2,reflection:"No levels, no trade."}});
  return{[a.date]:a,[b.date]:b};}
function live(){return Object.values(state.entries).filter(e=>!e.deleted&&!isBlank(e));}
function deletedNotes(){return Object.values(state.entries).filter(e=>e.deleted);}
function applyTheme(){const t=state.prefs.theme||"auto";const r=document.documentElement;
  if(t==="batman"){r.setAttribute("data-theme","dark");r.setAttribute("data-mode","batman");}
  else{r.removeAttribute("data-mode");if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);}}
const isBat=()=>document.documentElement.getAttribute("data-mode")==="batman";

function titleOf(k){const t=TITLE[k];return typeof t==="function"?t():t;}
function layout(){const st=state.stack;const top=st[st.length-1],under=st[st.length-2];
  Object.entries(SCREEN).forEach(([k,id])=>{const el=document.getElementById(id);el.classList.toggle("on",k===top);el.classList.toggle("under",k===under);

function push(k){if(state.stack[state.stack.length-1]===k)return;const i=state.stack.indexOf(k);if(i>=0)state.stack.length=i;state.stack.push(k);
  const c=$("#"+SCREEN[k]+" .content");if(k!=="cal")c.scrollTop=0;onScroll({target:c});layout();}
function pop(){if(state.stack.length<=1)return;const leaving=state.stack.pop();if(leaving==="note")leaveNote();layout();
  const top=state.stack[state.stack.length-1];if(top==="list")renderList();if(top==="cal")renderCal(false);if(top==="folders")renderFolders();if(top==="stats")renderStats();}
function onScroll(ev){const c=ev.target;const s=c.closest(".screen");if(s)s.classList.toggle("scrolled",c.scrollTop>28);

  if(c.id==="calContent"){let cur=null;$$(".month",c).forEach(m=>{if(m.offsetTop<=c.scrollTop+140)cur=m;});
    if(cur){const h=cur.querySelector("h3 span").textContent;$("#calTitle").textContent=/\d{4}/.test(h)?h:h+" "+new Date().getFullYear();}}}

/* NYSE holidays (the cash open is what the 10 AM setup needs), with observed-day rules */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthWeekday(y,m,dow,n){const d=new Date(y,m,1);const off=(dow-d.getDay()+7)%7;return new Date(y,m,1+off+(n-1)*7);}
function lastWeekday(y,m,dow){const d=new Date(y,m+1,0);const off=(d.getDay()-dow+7)%7;return new Date(y,m,d.getDate()-off);}
function observed(y,m,d){const x=new Date(y,m,d);if(x.getDay()===6)return new Date(y,m,d-1);if(x.getDay()===0)return new Date(y,m,d+1);return x;}
const HOL_CACHE={};
function holidays(y){if(HOL_CACHE[y])return HOL_CACHE[y];const h={};const put=(dt,name)=>{h[iso(dt)]=name;};
  const ny=new Date(y,0,1);if(ny.getDay()===0)put(new Date(y,0,2),"New Year's Day");else if(ny.getDay()!==6)put(ny,"New Year's Day");
  put(nthWeekday(y,0,1,3),"MLK Day");put(nthWeekday(y,1,1,3),"Presidents' Day");
  const e=easter(y);put(new Date(y,e.getMonth(),e.getDate()-2),"Good Friday");
  put(lastWeekday(y,4,1),"Memorial Day");put(observed(y,5,19),"Juneteenth");put(observed(y,6,4),"Independence Day");
  put(nthWeekday(y,8,1,1),"Labor Day");put(nthWeekday(y,10,4,4),"Thanksgiving");put(observed(y,11,25),"Christmas");
  return HOL_CACHE[y]=h;}
function marketClosed(k){const d=parseDate(k);const dow=d.getDay();if(dow===0||dow===6)return"Weekend";return holidays(d.getFullYear())[k]||null;}
function monthPnl(y,m){let n=0,c=0;live().forEach(e=>{const d=parseDate(e.date);const p=dayPnl(e);if(d.getFullYear()===y&&d.getMonth()===m&&typeof p==="number"){n+=p;c++;}});return{n,c};}
function renderFolders(){const notes=live();const now=new Date();const mp=monthPnl(now.getFullYear(),now.getMonth());
  const tagCount={};notes.forEach(e=>(e.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const tags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const t=state.entries[todayStr()];const te=t&&!t._demo&&!t.deleted?t:null;
  const preOk=te&&readiness(te)!=null,postOk=te&&processScore(te)!=null;const tp=te?dayPnl(te):null;
  const session=!preOk?`<button class="startbtn" id="startSession"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/></svg>Start session</button>`
    :!postOk?`<div class="sstat"><span>Preparation · <b>${verdict(readiness(te)).t}</b> · ${readiness(te)}</span>${typeof tp==="number"?`<span class="pl ${pnlCls(tp)}">${money(tp)}</span>`:""}</div><button class="startbtn" id="endSession"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></svg>End session</button>`
    :`<div class="sstat"><span>Session filed · <b>${FEEL[(te.post.feeling||3)-1]}</b> · fit ${readiness(te)} · process ${processScore(te)}</span>${typeof tp==="number"?`<span class="pl ${pnlCls(tp)}">${money(tp)}</span>`:""}</div><button class="startbtn sec" id="openToday">Open today's note</button>`;
  const ms=statsFor(rangeDays("month"));
  $("#foldersContent").innerHTML=`<div class="large greet">${greeting()},<br>${esc(address())}.</div>
    <div class="subdate">${now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div>
    <div class="alf"><div class="k">Alfred</div><p>${esc(alfredLine())}</p></div>
    ${session}
    <div class="group">
      <button class="frow" data-go="cal"><svg class="ico red" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="t">Calendar</span><span class="cnt ${mp.c?pnlCls(mp.n):""}">${mp.c?money(mp.n):now.toLocaleDateString(undefined,{month:"long"})}</span>${CHEV}</button>
      <button class="frow" data-go="all"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="t">Journal</span><span class="cnt">${notes.length}</span>${CHEV}</button>
      <button class="frow" data-go="stats"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/></svg><span class="t">Stats</span><span class="cnt">${ms.winRate!=null?ms.winRate+"% win rate":"—"}</span>${CHEV}</button>
    </div>
    ${tags.length?`<div class="sech">Tags</div><div class="group">${tags.map(([t,n])=>`<button class="frow" data-tag="${esc(t)}"><span class="hash">#</span><span class="t">${esc(t)}</span><span class="cnt">${n}</span>${CHEV}</button>`).join("")}</div>`
      :`<div class="foot" style="margin:-8px 36px 0">Type a #tag in any note — #10am, #chop, #revenge — and it becomes a Smart Folder here.</div>`}`;
  $$("[data-go]",$("#foldersContent")).forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==="cal"){renderCal(true);push("cal");}else if(g==="stats"){renderStats();push("stats");}else{state.listMode="all";state.listTag=null;state.query="";renderList();push("list");}});
  $$("[data-tag]",$("#foldersContent")).forEach(b=>b.onclick=()=>{state.listMode="all";state.listTag=b.dataset.tag;state.query="";renderList();push("list");});
  const ss=$("#startSession");if(ss)ss.onclick=()=>{openNote(todayStr());setTimeout(()=>openPrompt("pre"),480);};
  const es=$("#endSession");if(es)es.onclick=()=>{openNote(todayStr());setTimeout(()=>openPrompt("post"),480);};
  const ot=$("#openToday");if(ot)ot.onclick=()=>openNote(todayStr());}

  {t:`Recently Deleted${deletedNotes().length?" ("+deletedNotes().length+")":""}`,fn:()=>{state.listMode="deleted";state.listTag=null;state.query="";renderList();push("list");}},
  {t:"Export all notes (JSON)",fn:()=>exportJSON()}]);

/* ================= CALENDAR ================= */
function renderCal(scrollToToday){const c=$("#calContent");const today=todayStr();const now=new Date();const prev=c.scrollTop;
  const byDate={};live().forEach(e=>byDate[e.date]=e);
  const first=new Date(now.getFullYear(),now.getMonth()-18,1),last=new Date(now.getFullYear(),now.getMonth()+7,0);
  let html=`<div class="calwrap">`;const WK=["M","T","W","T","F","S","S"].map((x,i)=>`<span class="${i>4?"off":""}">${x}</span>`).join("");
  for(let m=new Date(first);m<=last;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const y=m.getFullYear(),mo=m.getMonth();const days=new Date(y,mo+1,0).getDate();const lead=(m.getDay()+6)%7;
    const cur=y===now.getFullYear()&&mo===now.getMonth();
    const name=m.toLocaleDateString(undefined,{month:"long"})+(y!==now.getFullYear()?" "+y:"");
    const mp=monthPnl(y,mo);let w=0,l=0;for(let d=1;d<=days;d++){const e=byDate[iso(new Date(y,mo,d))];const p=e?dayPnl(e):null;if(p>0)w++;else if(p<0)l++;}
    const glow=mp.c?(mp.n>0?"var(--gain)":mp.n<0?"var(--loss)":"var(--label3)"):"transparent";
    let cells="";for(let i=0;i<lead;i++)cells+=`<div class="dcell blank"></div>`;
    for(let d=1;d<=days;d++){const k=iso(new Date(y,mo,d));const e=byDate[k];const p=e?dayPnl(e):null;const closed=marketClosed(k);
      const extra=typeof p==="number"?`<span class="p ${pnlCls(p)}">${moneyShort(p)}</span>`:e?`<span class="dot"></span>`:(closed&&closed!=="Weekend"?`<span class="hol">${esc(closed)}</span>`:"");
      cells+=`<button class="dcell ${k===today?"today":""} ${closed?"off":""}" data-d="${k}" ${closed?`title="Market closed · ${esc(closed)}"`:""}><span class="n">${d}</span>${extra}</button>`;}
    const tail=(7-((lead+days)%7))%7;for(let i=0;i<tail;i++)cells+=`<div class="dcell blank"></div>`;
    html+=`<div class="month glass ${cur?"cur":""}" data-m="${y}-${mo}" style="--glowc:${glow}"><div class="glow"></div>
      <div class="mhead"><h3><span>${name}</span></h3>${mp.c?`<div class="mp"><b class="${pnlCls(mp.n)}">${money(mp.n)}</b><small>${mp.c} day${mp.c===1?"":"s"} · ${w}W ${l}L</small></div>`:""}</div>
      <div class="wk">${WK}</div><div class="mgrid">${cells}</div></div>`;}
  html+=`</div>`;c.innerHTML=html;
  $$(".dcell[data-d]",c).forEach(b=>b.onclick=()=>openNote(b.dataset.d));
  /* re-renders (store load, edits) keep the scroll position; a fresh open lands on the current month */
  const land=()=>{if(scrollToToday||prev===0){const cur=$(".month.cur",c);if(cur)c.scrollTop=cur.offsetTop-62;}else c.scrollTop=prev;onScroll({target:c});};
  land();requestAnimationFrame(land);}

function sectionOf(dateStr){const t=parseDate(todayStr()),d=parseDate(dateStr);const diff=Math.round((t-d)/864e5);
  if(diff<=0)return"Today";if(diff===1)return"Yesterday";if(diff<7)return"Previous 7 Days";if(diff<30)return"Previous 30 Days";
  return d.toLocaleDateString(undefined,{month:"long"})+(d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():"");}
function rowDate(e){const t=todayStr();if(e.date===t)return new Date(e.updated||Date.now()).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  if(e.date===addDays(t,-1))return"Yesterday";return parseDate(e.date).toLocaleDateString(undefined,{day:"2-digit",month:"2-digit",year:"numeric"});}
function preview(e){const t=(e.notes||"").split("\n").map(s=>s.trim()).filter(Boolean);const body=t.slice(1).join(" ").replace(/(^|\s)#[\p{L}\p{N}_-]+/gu,"").replace(/\s+/g," ").trim();return body||"No additional text";}
function renderList(){const c=$("#listContent");const del=state.listMode==="deleted";const q=state.query.trim().toLowerCase();const tag=state.listTag;
  let items=del?deletedNotes():live();
  if(tag)items=items.filter(e=>(e.tags||[]).includes(tag));
  if(q)items=items.filter(e=>((e.title||"")+" "+(e.notes||"")).toLowerCase().includes(q));
  items.sort((a,b)=>a.date<b.date?1:-1);
  const title=del?"Recently Deleted":tag?"#"+tag:"Journal";$("#listTitle").textContent=title;
  const row=e=>{const p=dayPnl(e);const tg=(e.tags||[]).slice(0,3).map(t=>`<span class="tg">#${esc(t)}</span>`).join("");
    return`<button class="nrow" data-d="${e.date}"><span class="txt"><span class="ttl"><span>${esc(e.title)||"New Note"}</span>${typeof p==="number"?`<span class="pnl ${pnlCls(p)}">${money(p)}</span>`:""}</span><span class="sub"><b>${del?"Deleted "+new Date(e.deletedAt||e.updated).toLocaleDateString(undefined,{day:"2-digit",month:"2-digit",year:"2-digit"}):rowDate(e)}</b>${tg}${esc(preview(e))}</span></span>${e.pinned&&!del?`<svg class="pinico" viewBox="0 0 24 24"><path d="M12 17v5M8 17h8l-1-5 2-2V6H7v4l2 2z"/></svg>`:""}${e.hasChart?`<img class="thumb" data-thumb="${e.date}" alt="">`:""}</button>`;};
  let html=`<div class="large">${esc(title)}</div>`;
  if(!del&&!tag&&!q){const now=new Date();const mp=monthPnl(now.getFullYear(),now.getMonth());if(mp.c)html+=`<div class="subdate" style="margin-top:-6px">${now.toLocaleDateString(undefined,{month:"long"})} <b class="${pnlCls(mp.n)}">${money(mp.n)}</b> · ${mp.c} day${mp.c===1?"":"s"}</div>`;}
  if(tag){const t=items.reduce((a,e)=>a+(dayPnl(e)||0),0);const n=items.filter(e=>typeof dayPnl(e)==="number").length;if(n)html+=`<div class="subdate" style="margin-top:-6px"><b class="${pnlCls(t)}">${money(t)}</b> across ${n} day${n===1?"":"s"}</div>`;}
  if(del)html+=`<div class="foot" style="margin:-2px 20px 20px">Notes are available here for 30 days. After that time, notes will be permanently deleted.</div>`;

/* ---- editor ---- */
let saveTimer;

function setupEditor(e){const ed=$("#ed"),et=$("#edt");if(!ed)return;normalize(ed);if(e._demo)return;
  const commit=()=>{normalize(ed);const title=(et.textContent||"").replace(/\s+/g," ").trim().slice(0,120);
    e.title=title;e.notesHtml=`<div>${esc(title)||"<br>"}</div>`+ed.innerHTML;e.fmt=2;
    const lines=(ed.innerText||"").replace(/ /g," ").split("\n").map(s=>s.trim()).filter(Boolean);
    e.notes=[title,...lines].filter(Boolean).join("\n");e.tags=tagsOf(e.notes);
    $("#noteTitle").textContent=e.title;scheduleSave();};
  ed._commit=commit;ed.oninput=commit;et.oninput=commit;
  ed.onfocus=()=>setEditing(true);et.onfocus=()=>setEditing(true);
  /* the title is one line: Enter moves into the body, paste is plain text */
  et.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();ed.focus();caretAtEnd(ed.firstElementChild||ed);}});
  et.addEventListener("paste",ev=>{const t=ev.clipboardData&&ev.clipboardData.getData("text/plain");if(t==null)return;ev.preventDefault();document.execCommand("insertText",false,t.replace(/\s+/g," "));commit();});
  ed.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest(".ckbox");if(!b)return;ev.preventDefault();const li=b.parentElement;li.dataset.done=li.dataset.done==="1"?"0":"1";commit();});
  ed.addEventListener("paste",ev=>{const t=ev.clipboardData&&ev.clipboardData.getData("text/plain");if(!t)return;ev.preventDefault();document.execCommand("insertText",false,t);commit();});
  ed.addEventListener("keyup",syncFmt);ed.addEventListener("mouseup",syncFmt);
  ed.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"&&!ev.shiftKey&&!ev.metaKey&&!ev.ctrlKey){
      const li=curLi();const ul=li&&li.parentElement;
      if(ul&&ul.classList.contains("ckl")){
        if(!li.textContent.trim()){ev.preventDefault();const d=document.createElement("div");d.appendChild(document.createElement("br"));ul.parentNode.insertBefore(d,ul.nextSibling);li.remove();if(!ul.children.length)ul.remove();caretAtEnd(d);commit();return;}
        setTimeout(()=>{const nl=curLi();if(nl&&nl!==li&&nl.parentElement&&nl.parentElement.classList.contains("ckl")){nl.dataset.done="0";commit();}},0);return;}
      /* after a heading, Enter gives Body — as Notes does */
      const blk=curBlock();
      if(blk&&/^H[1-3]$/.test(blk.tagName))setTimeout(()=>{const nb=curBlock();if(nb&&nb!==blk&&nb.parentElement===ed){const d=document.createElement("div");while(nb.firstChild)d.appendChild(nb.firstChild);if(!d.firstChild)d.appendChild(document.createElement("br"));nb.replaceWith(d);caretAtEnd(d);commit();}},0);
      return;}
    if(!(ev.metaKey||ev.ctrlKey)||!ev.shiftKey)return;
    const blk={KeyT:"H1",KeyH:"H2",KeyJ:"H3",KeyB:"P",KeyM:"PRE"}[ev.code];if(blk){ev.preventDefault();setBlock(blk);return;}
    const lst={Digit7:"ul",Digit8:"dash",Digit9:"ol",KeyL:"ckl"}[ev.code];if(lst){ev.preventDefault();setList(lst);}});}
function curBlock(){const s=window.getSelection();if(!s||!s.anchorNode)return null;let n=s.anchorNode;const ed=$("#ed");if(!ed)return null;
  while(n&&n.parentElement&&n.parentElement!==ed)n=n.parentElement;return n&&n.parentElement===ed?n:null;}
function normalize(ed){$$("ul.ckl>li",ed).forEach(li=>{if(li.dataset.done!=="1")li.dataset.done="0";const f=li.firstElementChild;
    if(!f||!f.classList.contains("ckbox")){const s=document.createElement("span");s.className="ckbox";s.contentEditable="false";li.insertBefore(s,li.firstChild);}});
  $$(".ckbox",ed).forEach(b=>{const li=b.parentElement;if(!li||li.tagName!=="LI"||!li.parentElement.classList.contains("ckl"))b.remove();});
  if(!ed.firstElementChild||ed.firstElementChild.tagName==="BR"){ed.innerHTML="<div><br></div>";}}

function edFocus(){const ed=$("#ed");if(ed&&ed.isContentEditable){ed.focus();return ed;}return null;}
function edCmd(cmd){const ed=edFocus();if(!ed)return;document.execCommand(cmd,false,null);ed._commit();syncFmt();}
function curLi(){const s=window.getSelection();if(!s||!s.anchorNode)return null;const n=s.anchorNode;const el=n.nodeType===1?n:n.parentElement;return el&&el.closest?el.closest("li"):null;}
function setBlock(tag){const ed=edFocus();if(!ed)return;const li=curLi();if(li&&li.parentElement)document.execCommand(li.parentElement.tagName==="OL"?"insertOrderedList":"insertUnorderedList");
  document.execCommand("formatBlock",false,tag==="P"?"div":tag);ed._commit();syncFmt();}
function setList(kind){const ed=edFocus();if(!ed)return;const li=curLi();const ul=li&&li.parentElement;
  if(ul&&(ul.tagName==="UL"||ul.tagName==="OL")){const idx=[...ul.children].indexOf(li);
    const cur=ul.tagName==="OL"?"ol":ul.classList.contains("ckl")?"ckl":ul.classList.contains("dash")?"dash":"ul";
    if(cur===kind){const frag=document.createDocumentFragment();let mark=null;[...ul.children].forEach((row,i)=>{const d=document.createElement("div");
        [...row.childNodes].forEach(n=>{if(!(n.nodeType===1&&n.classList&&n.classList.contains("ckbox")))d.appendChild(n);});if(!d.firstChild)d.appendChild(document.createElement("br"));if(i===idx)mark=d;frag.appendChild(d);});
      ul.replaceWith(frag);caretAtEnd(mark);}
    else{const want=kind==="ol"?"OL":"UL";let target=ul;if(ul.tagName!==want){target=document.createElement(want);while(ul.firstChild)target.appendChild(ul.firstChild);ul.replaceWith(target);}
      target.classList.remove("ckl","dash");if(kind==="ckl")target.classList.add("ckl");if(kind==="dash")target.classList.add("dash");if(kind!=="ckl")$$(".ckbox",target).forEach(b=>b.remove());
      caretAtEnd(target.children[idx]||target.lastElementChild);}}

    if(ul2&&ul2.tagName==="UL"){ul2.classList.remove("ckl","dash");if(kind==="ckl")ul2.classList.add("ckl");if(kind==="dash")ul2.classList.add("dash");}}

/* ---- session card: P&L, trades, R, Preparation, Debrief ---- */
const PRE_STEPS=[
  {k:"sleep",q:"How did you sleep?",lo:"Poorly",hi:"Rested"},
  {k:"calm",q:"How stressed are you right now?",lo:"Very",hi:"Not at all"},
  {k:"focus",q:"How clear is your head?",lo:"Foggy",hi:"Sharp"},
  {k:"control",q:"If the first trade loses, what happens?",lo:"I chase",hi:"Nothing"},
  {k:"confidence",q:"How confident are you in today's plan?",lo:"Not at all",hi:"Fully"},
  {k:"energy",q:"How is your energy?",lo:"Low",hi:"High"}];
const POST_STEPS=[
  {k:"pnl",q:"How did the day close?",pnl:true},
  {k:"feeling",q:"How did the session feel?",o:["Bad","Off","Neutral","Good","Great"]},
  {k:"plan",q:"Did you follow the plan?",o:["Not at all","Barely","Partly","Mostly","Fully"]},
  {k:"discipline",q:"How disciplined were your entries?",o:["Random","Loose","Mixed","Selective","A+ only"]},
  {k:"impulse",q:"Did FOMO or impulse show up?",o:["Constantly","Often","Sometimes","Rarely","Never"],invert:true},
  {k:"satisfaction",q:"Happy with your execution?",o:["No","Not really","Somewhat","Yes","Proud of it"]},
  {k:"reflection",q:"One line for tomorrow",text:true}];
const FEEL=["Bad","Off","Neutral","Good","Great"];
function readiness(e){const v=PRE_STEPS.map(s=>e.pre&&e.pre[s.k]).filter(x=>typeof x==="number");if(v.length<PRE_STEPS.length)return null;return Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100);}
function verdict(s){const A=address();return s>=80?{t:"Fit to trade",d:`Normal size, ${A}. Follow the plan and come home.`}:s>=60?{t:"Reduce size",d:`Half size, ${A}, and only the cleanest sweep.`}:{t:"Do not trade",d:`Sit today out and write down why, ${A}. The market will be here tomorrow.`};}
function processScore(e){const p=e.post||{};if(!p.feeling)return null;const v=POST_STEPS.filter(s=>!s.text&&!s.pnl&&s.k!=="feeling").map(s=>{const x=p[s.k];return typeof x==="number"?(s.invert?6-x:x):null;}).filter(x=>x!=null);if(!v.length)return null;return Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100);}
function processLine(s){const A=address();return s>=80?`Process held. That is what it is supposed to look like, ${A}.`:s>=60?`A few leaks, ${A}. Name them, then leave them here.`:`The process broke, ${A}. The plan knew better than the afternoon did.`;}

function step(dir){if(!PS||psBusy)return;const card=$("#pcard");if(card&&dir>0)card.classList.add("out");psBusy=true;

function rangeDays(range){const all=live().sort((a,b)=>a.date<b.date?-1:1);const now=new Date();const t=todayStr();
  if(range==="all")return all;let from;
  if(range==="month")from=new Date(now.getFullYear(),now.getMonth(),1);else if(range==="3m")from=new Date(now.getFullYear(),now.getMonth()-2,1);else from=new Date(now.getFullYear(),0,1);
  const f=iso(from);return all.filter(e=>e.date>=f&&e.date<=t);}
function statsFor(days){const S={days:days.length};const P=days.filter(e=>typeof dayPnl(e)==="number").map(e=>({e,p:dayPnl(e)}));
  S.traded=P.length;S.net=P.reduce((a,x)=>a+x.p,0);const dec=P.filter(x=>x.p!==0);const W=dec.filter(x=>x.p>0),L=dec.filter(x=>x.p<0);
  S.wins=W.length;S.losses=L.length;S.winRate=dec.length?Math.round(W.length/dec.length*100):null;
  const gw=W.reduce((a,x)=>a+x.p,0),gl=Math.abs(L.reduce((a,x)=>a+x.p,0));S.avgWin=W.length?gw/W.length:null;S.avgLoss=L.length?-gl/L.length:null;
  S.pf=gl?gw/gl:(gw?Infinity:null);S.expectancy=dec.length?S.net/dec.length:null;
  S.best=P.length?P.reduce((a,x)=>x.p>a.p?x:a):null;S.worst=P.length?P.reduce((a,x)=>x.p<a.p?x:a):null;
  const rs=days.map(e=>e.r).filter(x=>typeof x==="number");S.totalR=rs.length?rs.reduce((a,b)=>a+b,0):null;S.avgR=rs.length?S.totalR/rs.length:null;
  const tc=days.map(e=>e.tradeCount).filter(x=>typeof x==="number");S.avgTrades=tc.length?tc.reduce((a,b)=>a+b,0)/tc.length:null;S.totalTrades=tc.length?tc.reduce((a,b)=>a+b,0):null;
  let cum=0,peak=0,dd=0;S.curve=P.map(x=>{cum+=x.p;peak=Math.max(peak,cum);dd=Math.max(dd,peak-cum);return cum;});S.maxDD=P.length?dd:null;
  let best=0,run=0;P.forEach(x=>{if(x.p>0){run++;best=Math.max(best,run);}else if(x.p<0)run=0;});S.bestStreak=best;
  let cur=0;for(let i=P.length-1;i>=0;i--){if(P[i].p>0)cur++;else if(P[i].p<0)break;}S.curStreak=cur;
  const fits=days.map(readiness).filter(x=>x!=null);S.avgFit=fits.length?Math.round(fits.reduce((a,b)=>a+b,0)/fits.length):null;
  const procs=days.map(processScore).filter(x=>x!=null);S.avgProc=procs.length?Math.round(procs.reduce((a,b)=>a+b,0)/procs.length):null;
  const byV={fit:[],reduce:[],no:[]};P.forEach(x=>{const f=readiness(x.e);if(f==null)return;byV[f>=80?"fit":f>=60?"reduce":"no"].push(x.p);});
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;S.byVerdict=[["Fit to trade",avg(byV.fit),byV.fit.length],["Reduce size",avg(byV.reduce),byV.reduce.length],["Do not trade",avg(byV.no),byV.no.length]];
  S.fitAvg=avg(byV.fit);const un=[...byV.reduce,...byV.no];S.unfitAvg=avg(un);
  const feel={};days.forEach(e=>{if(e.post&&e.post.feeling)feel[e.post.feeling]=(feel[e.post.feeling]||0)+1;});S.feel=feel;
  S.impulseDays=days.filter(e=>e.post&&e.post.impulse>=4).length;S.debriefed=days.filter(e=>e.post&&e.post.feeling).length;
  const tags={};P.forEach(x=>(x.e.tags||[]).forEach(t=>{(tags[t]=tags[t]||{n:0,p:0});tags[t].n++;tags[t].p+=x.p;}));S.tags=Object.entries(tags).map(([t,v])=>[t,v.p,v.n,v.p/v.n]).sort((a,b)=>b[2]-a[2]).slice(0,6);
  return S;}
function equitySVG(curve){if(curve.length<2)return"";const W=520,H=120;const pts=[0,...curve];const min=Math.min(0,...pts),max=Math.max(0,...pts),rg=(max-min)||1;
  const x=i=>i/(pts.length-1)*W,y=v=>H-6-((v-min)/rg)*(H-12);const line=pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last=pts[pts.length-1];const col=last>=0?"var(--gain)":"var(--loss)";const rgb=isBat()?(last>=0?"143,180,227":"107,118,132"):(last>=0?"52,199,89":"255,69,58");
  const a=isBat()?.22:.28;
  return`<svg class="eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(${rgb},${a})"/><stop offset="1" stop-color="rgba(${rgb},0)"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--sep)" stroke-width="1" stroke-dasharray="3 4"/>
    <polygon points="0,${y(0).toFixed(1)} ${line} ${W},${y(0).toFixed(1)}" fill="url(#eqg)" stroke="none"/>
    <polyline points="${line}" stroke="${col}" stroke-width="2.2" fill="none"/><circle cx="${W}" cy="${y(last).toFixed(1)}" r="4" fill="${col}" stroke="none"/></svg>`;}
state.statsRange="month";

  const maxAbs=Math.max(1,...S.byVerdict.map(r=>Math.abs(r[1]||0)));const maxTag=Math.max(1,...S.tags.map(t=>Math.abs(t[1])));

    <div class="sech">Performance</div><div class="srows">

      <div class="row2"><span class="n">Max drawdown</span><span class="v">${S.maxDD?"−"+CUR+S.maxDD.toLocaleString(undefined,{maximumFractionDigits:0}):"—"}</span></div>

      <div class="row2"><span class="n">Average readiness</span><span class="v">${fmt(S.avgFit,v=>v)}</span></div>

    <div style="height:10px"></div>`;
  $$("[data-r]",c).forEach(b=>b.onclick=()=>{state.statsRange=b.dataset.r;const top=c.scrollTop;renderStats();c.scrollTop=top;});}

/* ================= ALFRED ================= */
function alfredLine(){const A=address();const today=todayStr();const t=state.entries[today];const te=t&&!t._demo&&!t.deleted?t:null;
  const all=live().filter(e=>!e._demo).sort((a,b)=>a.date<b.date?-1:1);const closed=marketClosed(today);
  if(te&&processScore(te)!=null){const p=processScore(te);const pl=dayPnl(te);
    if(p>=80)return`Filed. Process ${p}${typeof pl==="number"?`, ${money(pl)}`:""}. That is the version of you I would back, ${A}.`;
    if(p>=60)return`Filed. Process ${p}. Good enough to keep, ${A}; not good enough to be proud of.`;
    return`Filed. Process ${p}. Tomorrow the sweep comes first — nothing before it, ${A}.`;}
  if(te&&readiness(te)!=null){const f=readiness(te);
    if(f>=80)return`Fit to trade, ${A}. Normal size; let the setup do the work.`;
    if(f>=60)return`You marked yourself ${f}, ${A}. Half size today, and only the cleanest sweep.`;
    return`You marked yourself ${f}, ${A}. If you trade at all, make it one trade.`;}
  if(closed==="Weekend")return`Markets are closed, ${A}. Review the week; don't invent a trade.`;
  if(closed)return`${closed}. No 10 AM today, ${A}. Rest is also preparation.`;
  const past=all.filter(e=>e.date<today);
  if(!past.length)return`Nothing filed yet, ${A}. The first note is the hardest one.`;
  const y=past[past.length-1];const yp=processScore(y);const ypl=dayPnl(y);
  let streak=0;for(let i=past.length-1;i>=0;i--){const p=dayPnl(past[i]);if(p>0)streak++;else break;}
  if(streak>=3)return`${streak} green days in a row, ${A}. This is exactly when people change something. Don't.`;
  if((y.tags||[]).includes("revenge")||(y.post&&y.post.impulse>=4))return`Yesterday got away from you, ${A}. Today the only job is waiting for the sweep.`;
  if(typeof ypl==="number"&&ypl<0&&yp!=null&&yp>=70)return`Red yesterday with a clean process, ${A}. That is a cost of doing business, not a mistake.`;
  const now=new Date();const mp=monthPnl(now.getFullYear(),now.getMonth());
  if(mp.c>=5&&mp.n<0)return`The month is ${money(mp.n)}, ${A}. Fewer trades, not more.`;
  if(mp.c>=5&&mp.n>0)return`${money(mp.n)} on the month, ${A}. Protect it — the 10 AM setup or nothing.`;
  return`Before the open, ${A}: mark the 10:00 level, then do nothing until the sweep.`;}
function alfredStats(S){const A=address();
  if(S.traded<3)return`Log a few more sessions, ${A}, and I will have something worth saying.`;
  if(S.fitAvg!=null&&S.unfitAvg!=null&&S.byVerdict[0][2]>=2)return`When you marked yourself fit you averaged ${money(S.fitAvg)} a day, ${A}; otherwise ${money(S.unfitAvg)}. The check-in is worth more than any indicator.`;
  if(S.impulseDays>=2&&S.debriefed)return`Impulse showed up on ${S.impulseDays} of ${S.debriefed} debriefed days, ${A}. That is the leak; everything else is noise.`;
  if(S.pf!=null&&S.pf!==Infinity)return S.pf>=1.5?`Profit factor ${S.pf.toFixed(2)}, ${A}. The edge is real; the job is not to dilute it.`:`Profit factor ${S.pf.toFixed(2)}, ${A}. Either the winners need more room or the losers need a shorter leash.`;
  if(S.curStreak>=3)return`${S.curStreak} green days running, ${A}. Same size tomorrow.`;
  return`${S.winRate}% of days green, ${A}. Consistency first; size later.`;}

function compress(file,maxW=1400,maxChars=228000){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    let q=.82,out=c.toDataURL("image/jpeg",q);while(out.length>maxChars&&q>.35){q-=.09;out=c.toDataURL("image/jpeg",q);}
    if(out.length>maxChars){const c2=document.createElement("canvas");c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);const x2=c2.getContext("2d");x2.fillStyle="#000";x2.fillRect(0,0,c2.width,c2.height);x2.drawImage(img,0,0,c2.width,c2.height);out=c2.toDataURL("image/jpeg",.7);}res(out);};img.onerror=rej;img.src=url;});}
